name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Architecture check
        run: npm run arch:check

      - name: Architecture change-policy check (diff-aware)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # The exact base SHA GitHub resolved for this PR — more robust than a ref name,
            # which needs a remote-tracking branch to exist locally.
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "No previous commit to diff against (new branch) — skipping change-policy check."
            exit 0
          fi
          node build/aglc.js check --arch architecture.o --project . --diff "$BASE"
