# Starter template shipped with aglang (`aglc install-extractors`).
#
# Promotes a resolved cross-component method call into a `flow` fact, so a
# call into another component's class/function (e.g. `repo.save(order)`
# resolving into a Data-access component) is reachable in the same way a
# direct DB-driver import already is.
#
# Scope: only fires where the extractor stamped `resolved: true` on a
# `calls` edge. Today that is TypeScript/JavaScript/C# only — those are the
# languages with cross-file call resolution (`src/ir/semantic-index.ts`).
# Python/Go/Rust/Java/Swift calls are never `resolved: true` yet, so this
# template is a no-op for those languages until that resolver is extended.
#
# `confidence: probable` means this is non-blocking by default (only
# enforced under `--strict`) — review what it surfaces before tightening it.
# Narrow `match` (e.g. add a `from.file` path filter) once you've seen what
# your codebase's call graph actually produces.
id: ResolvedCallsAsFlow
owner: architecture
version: 1
confidence: probable
match:
  kind: calls
  resolved: true
emit:
  kind: flow
  from: "$component"
  to: "$targetComponent"
